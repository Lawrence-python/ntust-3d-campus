const MD={day:{L:[.45,.8,.4],lc:[1.3,1.2,1.02],sk:[.45,.62,.9],hz:[.78,.84,.9],amb:.8,night:0,wet:0,n:'日間'},
dusk:{L:[-.8,.26,.45],lc:[1.8,1,.5],sk:[.3,.36,.6],hz:[.95,.6,.4],amb:.6,night:.4,wet:0,n:'黃昏'},
night:{L:[.3,.7,-.4],lc:[.2,.27,.45],sk:[.04,.07,.14],hz:[.05,.08,.14],amb:.6,night:1,wet:1,n:'雨夜'}};
let mk='day',rain=false,auto=false,labs=false;
function tgt(){const m=MD[mk],o={L:nm(m.L),lc:[...m.lc],sk:[...m.sk],hz:[...m.hz],amb:m.amb,night:m.night,wet:rain?1:m.wet};
if(rain){const k=1-m.night;o.lc=o.lc.map(v=>v*.45);o.sk=o.sk.map((v,i)=>v*.6+[.12,.14,.17][i]*.4*k);o.hz=o.hz.map((v,i)=>v*.6+[.25,.27,.3][i]*.4*k)}return o}
let cur=tgt();const lerp=(a,b,k)=>Array.isArray(a)?a.map((v,i)=>v+(b[i]-v)*k):a+(b-a)*k;
// ---------- 相機 ----------
const D={y:.35,p:.62,d:110,x:0,z:0},C={...D};let sel=0,hov=0;
const info=document.getElementById('inf'),hv=document.getElementById('hv');
function bbox(id){const b=[1e9,0,1e9,-1e9,0,-1e9];for(const e of BL)if(e.id==id){b[0]=Math.min(b[0],e.b[0]);b[2]=Math.min(b[2],e.b[2]);b[3]=Math.max(b[3],e.b[3]);b[5]=Math.max(b[5],e.b[5])}return b}
function select(id){sel=id;if(!id){info.style.display='none';reset();return}const b=bbox(id);D.x=(b[0]+b[3])/2;D.z=(b[2]+b[5])/2;D.d=Math.max(24,Math.hypot(b[3]-b[0],b[5]-b[2])*1.9);D.p=.5;
document.getElementById('ic').textContent=NM[id].code;document.getElementById('iz').textContent=NM[id].zh;info.style.display='block'}
function reset(){sel=0;info.style.display='none';D.x=0;D.z=0;D.d=110;D.p=.62;D.y=.35+Math.round((D.y-.35)/6.2832)*6.2832}
D.d=110;
// ---------- 輸入 ----------
const ptr=new Map();let mv=0,pd0=0,t0=0,lastTap=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);mv=0;t0=performance.now();if(ptr.size==2){const[a,b]=[...ptr.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);
if(o){const dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);mv+=Math.abs(dx)+Math.abs(dy);
if(ptr.size==1){D.y-=dx*.006;D.p=Math.min(1.35,Math.max(.12,D.p+dy*.005))}else if(ptr.size==2){const[a,b]=[...ptr.values()],n=Math.hypot(a[0]-b[0],a[1]-b[1]);D.d=Math.min(170,Math.max(12,D.d*pd0/n));pd0=n}}
else if(e.pointerType=='mouse'){hov=pick(e.clientX,e.clientY);if(hov){hv.style.display='block';hv.style.left=e.clientX+14+'px';hv.style.top=e.clientY+14+'px';hv.textContent=NM[hov].zh+'  '+NM[hov].code}else hv.style.display='none'}});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(mv<6&&performance.now()-t0<450){const id=pick(e.clientX,e.clientY);if(id)select(id);
const n=performance.now();if(n-lastTap<320&&e.pointerType!='mouse')reset();lastTap=n}});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();D.d=Math.min(170,Math.max(12,D.d*Math.exp(e.deltaY*.001)))},{passive:false});
cv.addEventListener('dblclick',reset);
let EYE=[0,0,0],VPm,fov=.6;
function pick(px,py){const W=cv.clientWidth,H=cv.clientHeight,f=nm([C.x-EYE[0],-EYE[1],C.z-EYE[2]]),r=nm(cr(f,[0,1,0])),u=cr(r,f),tn=Math.tan(fov/2),x=px/W*2-1,y=1-py/H*2,as=W/H;
const d=nm([f[0]+r[0]*x*tn*as+u[0]*y*tn,f[1]+r[1]*x*tn*as+u[1]*y*tn,f[2]+r[2]*x*tn*as+u[2]*y*tn]);let best=0,bt=1e9;
for(const e of BL){const b=e.b;let t0=-1e9,t1=1e9;for(let a=0;a<3;a++){const lo=b[a],hi=b[a+3],o=EYE[a],q=d[a];if(Math.abs(q)<1e-6){if(o<lo||o>hi){t0=1e9}}else{let a1=(lo-o)/q,a2=(hi-o)/q;if(a1>a2)[a1,a2]=[a2,a1];t0=Math.max(t0,a1);t1=Math.min(t1,a2)}}
if(t0<=t1&&t1>0&&t0<bt){bt=t0;best=e.id}}return best}
// ---------- UI ----------
const $=id=>document.getElementById(id),bar=$('bar');
function ui(){document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==mk));$('bR').classList.toggle('on',rain);$('bA').classList.toggle('on',auto);$('bL').classList.toggle('on',labs);$('bS').classList.toggle('on',POST&&fx.s);$('bO').classList.toggle('on',POST&&fx.o);$('bD').classList.toggle('on',POST&&fx.d);
bar.textContent='目前場景：'+MD[mk].n+(rain?'＋雨':'')+'　｜　拖曳旋轉・滾輪或雙指縮放・點擊建築聚焦・雙擊重設　｜　'+(POST?(SM?'MSAA '+SM+'x、':'')+'PCF 陰影、'+(HDR?'HDR＋ACES':'LDR 後處理')+'；SSAO／Bloom／景深可於面板切換':'本裝置不支援 HDR 後處理，SSAO／Bloom／景深已停用')}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mk=b.dataset.m;rain=mk=='night';ui()});
$('bR').onclick=()=>{rain=!rain;ui()};$('bA').onclick=()=>{auto=!auto;ui()};$('bL').onclick=()=>{labs=!labs;LB.forEach(l=>l.style.display='none');ui()};$('bZ').onclick=reset;$('bS').onclick=()=>{fx.s=!fx.s;ui()};$('bO').onclick=()=>{fx.o=!fx.o;ui()};$('bD').onclick=()=>{fx.d=!fx.d;ui()};$('bB').onclick=()=>select(0);ui();
const LB=[];for(const id of Object.keys(NM)){const e=document.createElement('div');e.className='lb';e.textContent=NM[id].code;document.body.appendChild(e);const b=bbox(id),hh=Math.max(...BL.filter(q=>q.id==id).map(q=>q.b[4]));LB.push(Object.assign(e,{w:[(b[0]+b[3])/2,hh+.8,(b[2]+b[5])/2]}))}
// ---------- 繪製 ----------
const lampL=new Float32Array(LA),DR=()=>{gl.bindVertexArray(vao);gl.drawArrays(gl.TRIANGLES,0,NV);gl.bindVertexArray(wvao);gl.drawArraysInstanced(gl.TRIANGLES,0,NW,NS)};let pt=0,T=0;
const ac=x=>{x=Math.max(0,x);const v=(x*(2.51*x+.03))/(x*(2.43*x+.59)+.14);return Math.pow(Math.min(1,v),1/2.2)};
function frame(ts){requestAnimationFrame(frame);const dtm=Math.min(.05,(ts-pt)/1000||.016);pt=ts;T+=dtm;
const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;if(cv.width!=(W*dpr|0)||cv.height!=(H*dpr|0)){cv.width=W*dpr|0;cv.height=H*dpr|0;if(POST)setup(cv.width,cv.height)}
if(auto&&!sel)D.y+=dtm*.12;for(const k of['y','p','d','x','z'])C[k]+=(D[k]-C[k])*Math.min(1,dtm*6);
cur=((a,b)=>{const o={};for(const k in b)o[k]=lerp(a[k],b[k],Math.min(1,dtm*3));return o})(cur,tgt());
const as=W/H,dd=C.d*Math.max(1,1.15/as);EYE=[C.x+dd*Math.cos(C.p)*Math.sin(C.y),dd*Math.sin(C.p),C.z+dd*Math.cos(C.p)*Math.cos(C.y)];
const P=persp(fov,as,1,600),VM=look(EYE,[C.x,0,C.z],[0,1,0]);VPm=mul(P,VM);
const Ld=cur.L,LE=[Ld[0]*110,Ld[1]*110,Ld[2]*110],LV=mul(orth(-85,85,-85,85,10,260),look(LE,[0,0,0],[0,1,0]));
gl.bindVertexArray(vao);gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,SZ,SZ);gl.clear(gl.DEPTH_BUFFER_BIT);gl.useProgram(PD);
gl.uniformMatrix4fv(loc(PD,'VP'),false,LV);gl.uniformMatrix4fv(loc(PD,'LV'),false,LV);gl.uniform1f(loc(PD,'t'),T);DR();
gl.bindFramebuffer(gl.FRAMEBUFFER,POST?SCN:null);gl.viewport(0,0,cv.width,cv.height);
const bg=POST&&HDR?cur.hz:cur.hz.map(v=>ac(v));gl.clearColor(bg[0],bg[1],bg[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(PM);
const u=n=>loc(PM,n);gl.uniformMatrix4fv(u('VP'),false,VPm);gl.uniformMatrix4fv(u('LV'),false,LV);
gl.uniform3fv(u('L'),Ld);gl.uniform3fv(u('lc'),cur.lc);gl.uniform3fv(u('sk'),cur.sk);gl.uniform3fv(u('hz'),cur.hz);gl.uniform3fv(u('cam'),EYE);gl.uniform3fv(u('lamps'),lampL);
gl.uniform1f(u('amb'),cur.amb);gl.uniform1f(u('night'),cur.night);gl.uniform1f(u('wet'),cur.wet);gl.uniform1f(u('t'),T);gl.uniform1f(u('sel'),sel);gl.uniform1f(u('hov'),hov);
gl.uniform1f(u('dir'),POST&&HDR?0:1);gl.uniform1i(u('sh'),1);gl.uniform1i(u('tx'),0);DR();
if(rain){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(PR);gl.bindVertexArray(rvao);gl.uniformMatrix4fv(loc(PR,'VP'),false,VPm);gl.uniform1f(loc(PR,'t'),T);gl.uniform3f(loc(PR,'tg'),C.x,0,C.z);gl.drawArrays(gl.LINES,0,5200)}
if(POST)post(dd,as);
if(labs)for(const l of LB){const w=l.w,c=[VPm[0]*w[0]+VPm[4]*w[1]+VPm[8]*w[2]+VPm[12],VPm[1]*w[0]+VPm[5]*w[1]+VPm[9]*w[2]+VPm[13],VPm[3]*w[0]+VPm[7]*w[1]+VPm[11]*w[2]+VPm[15]];
if(c[2]<=0){l.style.display='none';continue}l.style.display='block';l.style.left=(c[0]/c[2]*.5+.5)*W+'px';l.style.top=(.5-c[1]/c[2]*.5)*H+'px';l.style.transform='translate(-50%,-100%)'}}
requestAnimationFrame(frame);
</script></body></html>
